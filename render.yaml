services:
  - type: web
    name: axo-api
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: axo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: axo-redis
          property: connectionString
  - type: worker
    name: axo-worker
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: axo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: axo-redis
          property: connectionString
  - type: redis
    name: axo-redis
    plan: standard

databases:
  - name: axo-postgres
    plan: standard
