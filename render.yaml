services:
  - type: web
    name: axo-api
    env: node
    plan: standard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: axo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: axo-redis
          property: connectionString
  - type: worker
    name: axo-worker
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: axo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: axo-redis
          property: connectionString
      - key: NODE_VERSION
          value: 20
      - key: NPM_CONFIG_PRODUCTION
          value: false
      - type: redis
          name: axo-redis
          plan: standard
          ipAllowList: []

databases:
  - name: axo-postgres
    plan: basic-256mb
    ipAllowList: []
